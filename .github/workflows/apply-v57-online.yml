name: Applica V77 non confermare pagamenti
on:
  push:
    paths:
      - 'v57-online.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correggi Non confermare su Android
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html=Path('index.html').read_text()
          sw=Path('service-worker.js').read_text()

          old="""   if(!confirm('Non confermare questa richiesta? Verrà eliminata senza inserirla nelle spese.'))return;\n   paymentActionBusy=true;setPendingBusy(true);rejectBtn.textContent='Elimino…';"""
          new="""   const rejectArmed=rejectBtn.dataset.rffRejectArmed==='1';\n   if(!rejectArmed){\n    rejectBtn.dataset.rffRejectArmed='1';\n    rejectBtn.textContent='Tocca ancora per eliminare';\n    rejectBtn.style.fontSize='13px';\n    setTimeout(()=>{if(rejectBtn.dataset.rffRejectArmed==='1'){delete rejectBtn.dataset.rffRejectArmed;rejectBtn.textContent='Non confermare';rejectBtn.style.fontSize=''}},4000);\n    return;\n   }\n   delete rejectBtn.dataset.rffRejectArmed;rejectBtn.style.fontSize='';\n   paymentActionBusy=true;setPendingBusy(true);rejectBtn.textContent='Elimino…';"""
          if old not in html:
            raise SystemExit('Handler Non confermare V76 non trovato')
          html=html.replace(old,new,1)

          html=html.replace('<title>Registro Finanziario Familiare V76</title>','<title>Registro Finanziario Familiare V77</title>',1)
          html=re.sub(r"service-worker\.js\?v=[^'\" ]+",'service-worker.js?v=20260930-v77-reject-no-dialog',html)
          sw=re.sub(r"const CACHE='[^']+';","const CACHE='rff-20260930-v77-reject-no-dialog';",sw,count=1)
          sw=re.sub(r"const SW_VERSION='[^']+';","const SW_VERSION='20260930-v77-reject-no-dialog';",sw,count=1)

          for marker in ['rff_reject_payment_v3','Tocca ancora per eliminare','rffRejectArmed','Registro Finanziario Familiare V77']:
            if marker not in html: raise SystemExit('Marker V77 mancante: '+marker)
          if "confirm('Non confermare questa richiesta?" in html:
            raise SystemExit('Dialog conferma vecchio ancora presente')
          if '20260930-v77-reject-no-dialog' not in sw:
            raise SystemExit('Cache V77 mancante')

          Path('index.html').write_text(html)
          Path('service-worker.js').write_text(sw)
          PY
      - name: Verifica V77
        run: |
          grep -q 'Tocca ancora per eliminare' index.html
          grep -q 'rffRejectArmed' index.html
          grep -q '20260930-v77-reject-no-dialog' service-worker.js
      - name: Pubblica V77
        run: |
          git config user.name "github-actions[bot]"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git diff --cached --quiet || git commit -m 'Publish V77 reject action without JS dialog'
          git push
