name: Applica V75 azioni pagamenti
on:
  push:
    paths:
      - 'v57-online.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correggi Conferma e Non confermare
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html=Path('index.html').read_text()
          sw=Path('service-worker.js').read_text()

          pattern=r"  x\.querySelector\('\.confirmPay'\)\.onclick=async\(\)=>\{.*?  h\.appendChild\(x\)"
          replacement=r'''  const confirmBtn=x.querySelector('.confirmPay'),rejectBtn=x.querySelector('.rejectPay');
  const setPendingBusy=(busy,label='')=>{
   [confirmBtn,rejectBtn].forEach(btn=>{btn.disabled=busy;btn.style.pointerEvents=busy?'none':'auto';btn.style.opacity=busy?'.65':'1'});
   if(label)confirmBtn.textContent=label;else confirmBtn.textContent='Conferma';
  };
  confirmBtn.onclick=async(ev)=>{
   ev.preventDefault();ev.stopPropagation();
   if(paymentActionBusy)return;
   const [yy,mm]=ymParts(),day=Number(x.querySelector('input').value),amount=Number(n.amount);
   if(!Number.isInteger(day)||day<1||day>new Date(yy,mm,0).getDate()||!Number.isFinite(amount)||amount<=0){alert('Controlla giorno e importo.');return}
   let cat=x.querySelector('select').value||'varie';
   paymentActionBusy=true;setPendingBusy(true,'Confermo…');
   try{
    if(!n.inboxId){
     const current=data();current.daily.entries||(current.daily.entries=[]);
     if(cat==='diesel-proposed'){let col=customCols().find(c=>(c.name||'').toLowerCase()==='diesel');if(!col){col={id:'diesel',name:'Diesel',budget:0};customCols().push(col)}cat=colKey(col)}
     current.daily.entries.push({id:'n_'+crypto.randomUUID(),day,category:cat,amount:(sgn==='-'?-1:1)*amount,desc:cleanNoticeDesc(n.desc)||'Notifica'});
     p.splice(i,1);save();renderDaily();return
    }
    if(cloudDirty){const saved=await saveCloud();if(!saved)throw new Error('Salvataggio del registro non riuscito')}
    const {data:ok,error}=await sb.rpc('rff_confirm_payment_v3',{...deviceArgs(),p_inbox_id:n.inboxId,p_month:month,p_day:day,p_category:cat});
    if(error)throw error;if(ok!==true)throw new Error('Il server non ha confermato l’operazione');
    await loadCloud();await fetchInbox();
   }catch(e){console.log('Conferma V75:',e);alert('Conferma non riuscita: '+(e?.message||'errore'))}
   finally{paymentActionBusy=false;setPendingBusy(false)}
  };
  rejectBtn.onclick=async(ev)=>{
   ev.preventDefault();ev.stopPropagation();
   if(paymentActionBusy)return;
   if(!confirm('Non confermare questa richiesta? Verrà eliminata senza inserirla nelle spese.'))return;
   paymentActionBusy=true;setPendingBusy(true);rejectBtn.textContent='Elimino…';
   try{
    if(!n.inboxId){p.splice(i,1);save();renderPending();return}
    if(cloudDirty){const saved=await saveCloud();if(!saved)throw new Error('Salvataggio del registro non riuscito')}
    const {data:ok,error}=await sb.rpc('rff_reject_payment_v3',{...deviceArgs(),p_inbox_id:n.inboxId});
    if(error)throw error;if(ok!==true)throw new Error('Il server non ha eliminato la richiesta');
    await loadCloud();await fetchInbox();
   }catch(e){console.log('Rifiuto V75:',e);alert('Non confermare non riuscito: '+(e?.message||'errore'))}
   finally{paymentActionBusy=false;rejectBtn.textContent='Non confermare';setPendingBusy(false)}
  };
  [confirmBtn,rejectBtn].forEach(btn=>{btn.type='button';btn.style.pointerEvents='auto';btn.style.touchAction='manipulation';btn.style.position='relative';btn.style.zIndex='20'});
  h.appendChild(x)'''

          html,n=re.subn(pattern,replacement,html,count=1,flags=re.S)
          if n!=1: raise SystemExit('Handler pagamenti V74 non trovato')
          html=re.sub(r"service-worker\.js\?v=[^'\" ]+",'service-worker.js?v=20260930-v75-server-actions',html)
          sw=re.sub(r"const CACHE='[^']+';","const CACHE='rff-20260930-v75-server-actions';",sw,count=1)
          sw=re.sub(r"const SW_VERSION='[^']+';","const SW_VERSION='20260930-v75-server-actions';",sw,count=1)

          required=['rff_confirm_payment_v3','rff_reject_payment_v3','Confermo…','Elimino…','20260930-v75-server-actions']
          for marker in required:
            if marker not in html and marker not in sw: raise SystemExit('Marker V75 mancante: '+marker)
          Path('index.html').write_text(html)
          Path('service-worker.js').write_text(sw)
          PY
      - name: Verifica V75
        run: |
          grep -q 'rff_confirm_payment_v3' index.html
          grep -q 'rff_reject_payment_v3' index.html
          grep -q '20260930-v75-server-actions' service-worker.js
      - name: Pubblica V75
        run: |
          git config user.name "github-actions[bot]"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git diff --cached --quiet || git commit -m 'Publish V75 server-side payment actions'
          git push
