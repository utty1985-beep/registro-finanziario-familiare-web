name: Applica V67 stabile online
on:
  push:
    paths:
      - 'v57-online.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integra versione stabile del Registro
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          ui=Path('v56-ui.js').read_text()
          main=Path('v56-main.js').read_text()
          polish=Path('v57-polish.js').read_text()
          red=Path('v58-red-button.js').read_text()
          longpress=Path('v61-longpress-toggle.js').read_text()

          # Il telefono principale è determinato dal ruolo del dispositivo.
          old_role="familyRole=(device.status==='active'&&accountRole==='owner')?'owner':'viewer';if(familyRole==='viewer')$('#addEntry').textContent='Invia da confermare';else $('#addEntry').textContent='+ Aggiungi pagamento';"
          new_role="familyRole=(device.status==='active'&&String(device.role||'')==='primary'&&accountRole==='owner')?'owner':'viewer';if(familyRole==='viewer')$('#addEntry').textContent='Invia pagamento';else $('#addEntry').textContent='+ Aggiungi pagamento';"
          if old_role not in main: raise SystemExit('V67 role marker missing')
          main=main.replace(old_role,new_role,1)

          # Sentinella: sola lettura della pagina Spese, tranne il modulo per inviare un pagamento.
          old_perm="const manualCard=$('#entryAmount')?.closest('.card');if(manualCard)manualCard.hidden=false;$('#sendForApproval').hidden=viewer;"
          new_perm="const manualCard=$('#entryAmount')?.closest('.card');if(manualCard)manualCard.hidden=false;const dailySettings=$('#p2 .settingsDrop');if(dailySettings){dailySettings.hidden=viewer;if(viewer)dailySettings.open=false}const pendingDrop=$('#pendingDrop');if(pendingDrop)pendingDrop.hidden=viewer;$('#sendForApproval').hidden=viewer;if(viewer)$('#addEntry').textContent='Invia pagamento';ensurePrimaryButton();"
          if old_perm not in main: raise SystemExit('V67 permissions marker missing')
          main=main.replace(old_perm,new_perm,1)

          # Se nessuna app di pagamento è selezionata, abilita automaticamente quelle riconosciute.
          send_marker="async function sendAndroidPayments(){\n if(!['owner','viewer'].includes(familyRole)||!familyId||!window.RegistroAndroid)return;"
          send_repl="function ensurePaymentSourcesEnabled(){const bridge=window.RegistroAndroid;if(!bridge?.availablePaymentSources||!bridge?.setAllowedPaymentSources)return;try{const sources=JSON.parse(bridge.availablePaymentSources()||'[]');if(!Array.isArray(sources)||!sources.length)return;const enabled=sources.filter(s=>s&&s.enabled&&s.package).map(s=>s.package);if(enabled.length)return;const packages=sources.map(s=>s&&s.package).filter(Boolean);if(packages.length)bridge.setAllowedPaymentSources(JSON.stringify(packages))}catch(e){console.log('Sorgenti pagamenti:',e)}}\nasync function sendAndroidPayments(){\n if(!['owner','viewer'].includes(familyRole)||!familyId||!window.RegistroAndroid)return;ensurePaymentSourcesEnabled();"
          if send_marker not in main: raise SystemExit('V67 payment marker missing')
          main=main.replace(send_marker,send_repl,1)

          # Recupero del telefono principale: utile dopo reinstallazioni o cambio origine PWA.
          primary_anchor="$('#sourcesButton').onclick=renderPaymentSources;\n$('#sendNotices').onclick=sendAndroidPayments;"
          primary_code="""$('#sourcesButton').onclick=renderPaymentSources;
$('#sendNotices').onclick=sendAndroidPayments;
function ensurePrimaryButton(){
 const host=$('#sentinelBar');if(!host)return;
 let btn=$('#makePrimaryPhone');
 if(!btn){btn=document.createElement('button');btn.id='makePrimaryPhone';btn.type='button';btn.textContent='📱 Rendi questo il telefono principale';btn.style.marginLeft='6px';host.appendChild(btn);const hint=document.createElement('div');hint.id='makePrimaryHint';hint.className='hint';hint.textContent='Usalo solo sul tuo telefono principale: abilita Conferma / Non confermare e lascia gli altri telefoni come sentinelle.';host.appendChild(hint);btn.onclick=async()=>{if(!confirm('Impostare questo come telefono principale? Gli altri telefoni resteranno sentinelle.'))return;btn.disabled=true;const old=btn.textContent;btn.textContent='Impostazione…';try{const {error}=await sb.rpc('rff_make_primary',deviceArgs());if(error)throw error;location.reload()}catch(e){console.log('Telefono principale:',e);alert('Impostazione non riuscita. Riprova con Internet attivo.');btn.disabled=false;btn.textContent=old}}}
 const show=familyRole==='viewer'&&accountRole==='owner';btn.hidden=!show;const hint=$('#makePrimaryHint');if(hint)hint.hidden=!show;
}
"""
          if primary_anchor not in main: raise SystemExit('V67 primary anchor missing')
          main=main.replace(primary_anchor,primary_code,1)

          anchor='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          start=html.index('<script>',html.index(anchor)+len(anchor))
          marker="<script>\nif ('serviceWorker' in navigator)"
          end=html.index(marker,start)
          html=html[:start]+'<script>\n'+ui+'\n</script>\n<script>\n'+main+'\n</script>\n<script>\n'+polish+'\n</script>\n<script>\n'+red+'\n</script>\n<script>\n'+longpress+'\n</script>\n'+html[end:]
          versions=[
              'service-worker.js?v=20260929-v61-longpress-dot',
              'service-worker.js?v=20260929-v60-direct-red',
              'service-worker.js?v=20260929-v59-rate-full-date',
              'service-worker.js?v=20260929-v58-red-button',
              'service-worker.js?v=20260929-v57-calendar-board',
              'service-worker.js?v=20260929-v52-calculator',
              'service-worker.js?v=20260929-v62-stable',
              'service-worker.js?v=20260930-v66-sentinel-sync'
          ]
          for oldv in versions:
              html=html.replace(oldv,'service-worker.js?v=20260930-v67-primary-confirm')
          required=[
              'rateDueDay','rateDueMonth','rateDueYear','calendarGrid','rffQuickNav',
              'V60_DIRECT_RED_BUTTON','RFF_LONGPRESS_V61','provisionalDot','lastVerticalScroll',
              '✅ Permessi attivi','✅ Notifiche da app attive','service-worker.js?v=20260930-v67-primary-confirm',
              "String(device.role||'')==='primary'",'Invia pagamento','ensurePaymentSourcesEnabled','makePrimaryPhone','rff_make_primary'
          ]
          for marker in required:
              if marker not in html: raise SystemExit('marker missing: '+marker)
          Path('index.html').write_text(html)
          PY
      - name: Verifica JavaScript
        run: |
          node --check v56-ui.js
          node --check v56-main.js
          node --check v57-polish.js
          node --check v58-red-button.js
          node --check v61-longpress-toggle.js
          node --check service-worker.js
      - name: Verifica file essenziali
        run: |
          test -s index.html
          test -s manifest.json
          test -s service-worker.js
          grep -q '20260929-v65-varie-collapse' service-worker.js
          grep -q 'v61-longpress-toggle.js' service-worker.js
      - name: Commit versione stabile online
        run: |
          git config user.name "github-actions[bot]"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Publish V67 primary phone confirmation recovery'
          git push
