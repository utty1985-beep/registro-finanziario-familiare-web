name: Applica V61 online
on:
  push:
    paths:
      - 'v57-online.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integra pressione lunga e pallino rosso persistente
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          ui=Path('v56-ui.js').read_text()
          main=Path('v56-main.js').read_text()
          polish=Path('v57-polish.js').read_text()
          red=Path('v58-red-button.js').read_text()
          longpress=Path('v61-longpress-toggle.js').read_text()
          anchor='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          start=html.index('<script>',html.index(anchor)+len(anchor))
          marker="<script>\nif ('serviceWorker' in navigator)"
          end=html.index(marker,start)
          html=html[:start]+'<script>\n'+ui+'\n</script>\n<script>\n'+main+'\n</script>\n<script>\n'+polish+'\n</script>\n<script>\n'+red+'\n</script>\n<script>\n'+longpress+'\n</script>\n'+html[end:]
          for oldv in ['service-worker.js?v=20260929-v60-direct-red','service-worker.js?v=20260929-v59-rate-full-date','service-worker.js?v=20260929-v58-red-button','service-worker.js?v=20260929-v57-calendar-board','service-worker.js?v=20260929-v52-calculator']:
              html=html.replace(oldv,'service-worker.js?v=20260929-v61-longpress-dot')
          for required in ['rateDueDay','rateDueMonth','rateDueYear','calendarGrid','rffQuickNav','V60_DIRECT_RED_BUTTON','RFF_LONGPRESS_V61','provisionalDot']:
              if required not in html: raise SystemExit('marker missing: '+required)
          Path('index.html').write_text(html)
          PY
      - name: Verifica JavaScript
        run: |
          node --check v56-ui.js
          node --check v56-main.js
          node --check v57-polish.js
          node --check v58-red-button.js
          node --check v61-longpress-toggle.js
      - name: Commit V61 online
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable long press provisional toggle with persistent red dot"
          git push
