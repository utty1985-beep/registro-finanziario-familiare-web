name: Applica V75 azioni pagamenti
on:
  push:
    paths:
      - 'v57-online.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correggi Conferma e Non confermare
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64
          html=Path('index.html').read_text()
          sw=Path('service-worker.js').read_text()
          pattern=r"  x\.querySelector\('\.confirmPay'\)\.onclick=async\(\)=>\{.*?  h\.appendChild\(x\)"
          encoded=""
          replacement=base64.b64decode(encoded).decode()
          html,n=re.subn(pattern,replacement,html,count=1,flags=re.S)
          if n!=1: raise SystemExit('Handler pagamenti V74 non trovato')
          html=re.sub(r"service-worker\.js\?v=[^'\" ]+",'service-worker.js?v=20260930-v75-server-actions',html)
          sw=re.sub(r"const CACHE='[^']+';","const CACHE='rff-20260930-v75-server-actions';",sw,count=1)
          sw=re.sub(r"const SW_VERSION='[^']+';","const SW_VERSION='20260930-v75-server-actions';",sw,count=1)
          for marker in ['rff_confirm_payment_v3','rff_reject_payment_v3','Confermo…','Elimino…']:
            if marker not in html: raise SystemExit('Marker V75 mancante: '+marker)
          if '20260930-v75-server-actions' not in sw: raise SystemExit('Cache V75 mancante')
          Path('index.html').write_text(html)
          Path('service-worker.js').write_text(sw)
          PY
      - name: Verifica V75
        run: |
          grep -q 'rff_confirm_payment_v3' index.html
          grep -q 'rff_reject_payment_v3' index.html
          grep -q '20260930-v75-server-actions' service-worker.js
      - name: Pubblica V75
        run: |
          git config user.name "github-actions[bot]"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git diff --cached --quiet || git commit -m 'Publish V75 server-side payment actions'
          git push
