name: Applica V76 tocco diretto pagamenti
on:
  push:
    paths:
      - 'v57-online.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rendi i pulsanti sensibili al tocco Android
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html=Path('index.html').read_text()
          sw=Path('service-worker.js').read_text()

          old="""  [confirmBtn,rejectBtn].forEach(btn=>{btn.type='button';btn.style.pointerEvents='auto';btn.style.touchAction='manipulation';btn.style.position='relative';btn.style.zIndex='20'});\n  h.appendChild(x)"""
          new="""  [confirmBtn,rejectBtn].forEach(btn=>{btn.type='button';btn.disabled=false;btn.style.pointerEvents='auto';btn.style.touchAction='manipulation';btn.style.position='relative';btn.style.zIndex='50'});\n  if(!h.dataset.rffDirectTouch){\n   h.dataset.rffDirectTouch='1';\n   const directFire=ev=>{\n    const btn=ev.target&&ev.target.closest?ev.target.closest('.confirmPay,.rejectPay'):null;\n    if(!btn||!h.contains(btn))return;\n    const now=Date.now(),last=Number(btn.dataset.rffLastTap||0);\n    if(now-last<650)return;btn.dataset.rffLastTap=String(now);\n    ev.preventDefault();ev.stopPropagation();\n    const fn=btn.onclick;if(typeof fn==='function')fn.call(btn,ev);\n   };\n   h.addEventListener('pointerup',directFire,true);\n   h.addEventListener('touchend',directFire,{capture:true,passive:false});\n  }\n  h.appendChild(x)"""
          if old not in html:
            raise SystemExit('Punto V75 non trovato')
          html=html.replace(old,new,1)

          # Piccolo marcatore diagnostico, senza cambiare il layout.
          html=html.replace('<title>Registro Finanziario Familiare V46</title>','<title>Registro Finanziario Familiare V76</title>',1)
          html=re.sub(r"service-worker\.js\?v=[^'\" ]+",'service-worker.js?v=20260930-v76-direct-touch',html)
          sw=re.sub(r"const CACHE='[^']+';","const CACHE='rff-20260930-v76-direct-touch';",sw,count=1)
          sw=re.sub(r"const SW_VERSION='[^']+';","const SW_VERSION='20260930-v76-direct-touch';",sw,count=1)

          for marker in ['rff_confirm_payment_v3','rff_reject_payment_v3','rffDirectTouch','pointerup','touchend','Registro Finanziario Familiare V76']:
            if marker not in html: raise SystemExit('Marker V76 mancante: '+marker)
          if '20260930-v76-direct-touch' not in sw: raise SystemExit('Cache V76 mancante')

          Path('index.html').write_text(html)
          Path('service-worker.js').write_text(sw)
          PY
      - name: Verifica V76
        run: |
          grep -q 'rffDirectTouch' index.html
          grep -q 'rff_confirm_payment_v3' index.html
          grep -q '20260930-v76-direct-touch' service-worker.js
      - name: Pubblica V76
        run: |
          git config user.name "github-actions[bot]"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git diff --cached --quiet || git commit -m 'Publish V76 direct Android touch actions'
          git push
