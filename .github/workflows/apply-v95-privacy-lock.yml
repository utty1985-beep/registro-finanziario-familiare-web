name: Applica V95 privacy e sblocco telefono
on:
  push:
    paths:
      - 'v95-privacy-lock.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica modifiche V95
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          sw=Path('service-worker.js').read_text()

          checks=[
            "Spese preventivate oggi",
            "function moneyText(real){return hidden?'••••••':real}",
            "setMoney(qs('#rffDashIncome'),income);setMoney(qs('#rffDashPlanned'),planned);setMoney(qs('#rffDashBalance'),'€ '+euro(currentBalance));",
            "qs('#rffDashTrendDiff').textContent=hidden?'•••••• rispetto al mese precedente':",
            "qs('#rffDashFoodSub').textContent=hidden?'Budget giornaliero ••••••':",
            "setMoney(row.querySelector('.amount'),'€ '+euro(it.amount));"
          ]
          for marker in checks:
            if marker not in html:
              raise SystemExit('Marker V94 non trovato: '+marker)

          html=html.replace("Spese preventivate oggi","Spese preventivate del mese",1)

          html=html.replace(
            "function moneyText(real){return hidden?'••••••':real}\n  function setMoney(el,real){if(!el)return;el.textContent=moneyText(real);el.classList.toggle('rffMasked',hidden)}",
            "function moneyText(real,maskable=true){return hidden&&maskable?'••••••':real}\n  function setMoney(el,real,maskable=true){if(!el)return;el.textContent=moneyText(real,maskable);el.classList.toggle('rffMasked',hidden&&maskable)}",
            1
          )
          html=html.replace(
            "setMoney(qs('#rffDashIncome'),income);setMoney(qs('#rffDashPlanned'),planned);setMoney(qs('#rffDashBalance'),'€ '+euro(currentBalance));",
            "setMoney(qs('#rffDashIncome'),income,true);setMoney(qs('#rffDashPlanned'),planned,false);setMoney(qs('#rffDashBalance'),'€ '+euro(currentBalance),true);",
            1
          )
          html=html.replace(
            "qs('#rffDashTrendDiff').textContent=hidden?'•••••• rispetto al mese precedente':(!up&&!down?'Nessuna differenza dal mese precedente':((up?'+ ':'− ')+'€ '+euro(Math.abs(delta))+' rispetto al mese precedente'));",
            "qs('#rffDashTrendDiff').textContent=!up&&!down?'Nessuna differenza dal mese precedente':((up?'+ ':'− ')+'€ '+euro(Math.abs(delta))+' rispetto al mese precedente');",
            1
          )
          html=html.replace(
            "const food=computeFood(d,key),foodReal='€ '+euro(food),foodEl=qs('#rffDashFood');setMoney(foodEl,foodReal);if(foodEl)foodEl.classList.toggle('neg',food<0);",
            "const food=computeFood(d,key),foodReal='€ '+euro(food),foodEl=qs('#rffDashFood');setMoney(foodEl,foodReal,false);if(foodEl)foodEl.classList.toggle('neg',food<0);",
            1
          )
          html=html.replace(
            "const daily=d?.daily||{};const dayBudget=Number(daily.food)||0;qs('#rffDashFoodSub').textContent=hidden?'Budget giornaliero ••••••':('Budget giornaliero € '+euro(dayBudget));",
            "const daily=d?.daily||{};const dayBudget=Number(daily.food)||0;qs('#rffDashFoodSub').textContent='Budget giornaliero € '+euro(dayBudget);",
            1
          )
          html=html.replace(
            "setMoney(row.querySelector('.amount'),'€ '+euro(it.amount));host.appendChild(row)",
            "setMoney(row.querySelector('.amount'),'€ '+euro(it.amount),false);host.appendChild(row)",
            1
          )

          if 'v95-device-lock.js' not in html:
            html=html.replace('</body>','<script src="./v95-device-lock.js?v=20261004-v95"></script>\n</body>',1)

          html=html.replace('Aggiornato 03/10 · V94','Aggiornato 04/10 · V95')
          html=html.replace("document.title='Registro Finanziario Familiare V94'","document.title='Registro Finanziario Familiare V95'")
          html=re.sub(r'<title>Registro Finanziario Familiare V\d+</title>','<title>Registro Finanziario Familiare V95</title>',html,count=1)
          html=re.sub(r"service-worker\.js\?v=[^'\" ]+",'service-worker.js?v=20261004-v95-privacy-lock',html)

          sw=re.sub(r"const CACHE='[^']+';","const CACHE='rff-20261004-v95-privacy-lock';",sw,count=1)
          sw=re.sub(r"const SW_VERSION='[^']+';","const SW_VERSION='20261004-v95-privacy-lock';",sw,count=1)
          if "'./v95-device-lock.js'" not in sw:
            sw=sw.replace("'./v85-calendar-fix.js'","'./v85-calendar-fix.js','./v95-device-lock.js'",1)

          required_after=[
            'Spese preventivate del mese',
            "setMoney(qs('#rffDashPlanned'),planned,false)",
            "setMoney(foodEl,foodReal,false)",
            "setMoney(row.querySelector('.amount'),'€ '+euro(it.amount),false)",
            'v95-device-lock.js?v=20261004-v95',
            'Aggiornato 04/10 · V95',
            "rff-20261004-v95-privacy-lock",
            "'./v95-device-lock.js'"
          ]
          for marker in required_after:
            if marker not in html and marker not in sw:
              raise SystemExit('Verifica V95 fallita: '+marker)

          Path('index.html').write_text(html)
          Path('service-worker.js').write_text(sw)
          PY
      - name: Verifica V95
        run: |
          grep -q 'Spese preventivate del mese' index.html
          grep -q "setMoney(qs('#rffDashPlanned'),planned,false)" index.html
          grep -q 'v95-device-lock.js?v=20261004-v95' index.html
          grep -q 'Aggiornato 04/10 · V95' index.html
          grep -q 'rff-20261004-v95-privacy-lock' service-worker.js
          grep -q "./v95-device-lock.js" service-worker.js
      - name: Pubblica V95
        run: |
          git config user.name "github-actions[bot]"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git diff --cached --quiet || git commit -m 'Publish V95 privacy and device unlock'
          git push
