name: Assemble V56 Main
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - 'v56-main.b64.part-*'
      - 'v56-build.trigger'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode main script
        run: |
          cat v56-main.b64.part-* > /tmp/v56-main.b64
          base64 -d /tmp/v56-main.b64 | gunzip > v56-main.js
          node --check v56-main.js
      - name: Commit generated script
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v56-main.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Assemble v56 family calendar main script'
          git push
